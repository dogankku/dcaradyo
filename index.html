<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0c11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Orbis — dünyanın dört bir yanından canlı radyo ve TV yayınları.">
<title>Orbis · Canlı Radyo & TV</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2334e3b0'/%3E%3Cstop offset='1' stop-color='%237c6cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='32' r='12' fill='none' stroke='%230a0c11' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%230a0c11'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0c11;--bg2:#10131a;--surface:rgba(255,255,255,.045);--surface2:rgba(255,255,255,.075);--surface3:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.08);--text:#f4f6fb;--muted:#a3abbd;--soft:#6f788c;
  --accent:#34e3b0;--accent2:#7c6cff;--danger:#ff6b81;--warn:#ffc35c;
  --grad:linear-gradient(135deg,var(--accent),var(--accent2));
  --radius:18px;--side:268px;--player-h:88px;--nav-h:0px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --display:"Plus Jakarta Sans",Inter,system-ui,sans-serif;
}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 15% -10%,rgba(124,108,255,.18),transparent 60%),radial-gradient(700px 420px at 95% 0%,rgba(52,227,176,.12),transparent 60%)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{display:block}
.i{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- layout ---------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:var(--side) minmax(0,1fr);gap:10px;padding:10px;height:100vh;height:100dvh;padding-bottom:calc(var(--player-h) + 20px)}
.sidebar{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 14px;display:flex;flex-direction:column;gap:16px;min-height:0;backdrop-filter:blur(20px)}
.brand{display:flex;align-items:center;gap:11px;padding:2px 6px}
.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;box-shadow:0 8px 24px rgba(52,227,176,.25)}
.brand-mark span{width:16px;height:16px;border-radius:50%;border:4px solid var(--bg);position:relative}
.brand-name{font-family:var(--display);font-size:21px;font-weight:800;letter-spacing:-.03em}
.brand-name small{display:block;font-family:Inter;font-size:11px;font-weight:500;color:var(--soft);letter-spacing:0}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-btn{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--muted);font-weight:600;font-size:14px;text-align:left;transition:.15s}
.nav-btn:hover{background:var(--surface2);color:var(--text)}
.nav-btn.active{background:var(--surface2);color:var(--text)}
.nav-btn.active .i{color:var(--accent)}
.nav-btn .count{margin-left:auto;font-size:11px;color:var(--soft);background:var(--surface);padding:2px 8px;border-radius:99px}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.side-title{font-size:11px;letter-spacing:.1em;color:var(--soft);font-weight:700;text-transform:uppercase}
.mini-search{position:relative}
.mini-search input{width:100%;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px 0 34px;outline:none;font-size:13px}
.mini-search .i{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--soft)}
.country-list{min-height:0;flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px;margin:0 -4px;padding:0 4px;scrollbar-width:thin;scrollbar-color:var(--surface3) transparent}
.c-btn{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;color:var(--muted);font-size:13.5px;font-weight:500;text-align:left;width:100%;transition:.12s}
.c-btn:hover{background:var(--surface2);color:var(--text)}
.c-btn.active{background:linear-gradient(90deg,rgba(52,227,176,.16),rgba(124,108,255,.08));color:var(--text)}
.c-btn .code{margin-left:auto;font-size:10.5px;color:var(--soft);font-weight:600}
.flag{width:22px;height:16px;border-radius:3px;object-fit:cover;flex-shrink:0;background:var(--surface3);box-shadow:0 0 0 1px rgba(255,255,255,.06)}
.flag.globe{display:grid;place-items:center;background:none;box-shadow:none;color:var(--accent)}
.flag.globe .i{width:18px;height:18px}

.main{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.scroller{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--surface3) transparent}
.header{position:sticky;top:0;z-index:10;padding:16px 22px 12px;background:linear-gradient(180deg,rgba(13,16,23,.94),rgba(13,16,23,.82));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid transparent;transition:border-color .2s}
.header.scrolled{border-bottom-color:var(--line)}
.top-row{display:flex;align-items:center;gap:10px}
.m-brand{display:none}
.search{position:relative;flex:1;max-width:460px}
.search input{width:100%;height:44px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);padding:0 40px 0 42px;outline:none;font-size:14px;transition:.15s}
.search input::placeholder{color:var(--soft)}
.search input:focus{border-color:rgba(52,227,176,.5);background:rgba(255,255,255,.09)}
.search>.i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--soft);width:18px;height:18px}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:10px;display:none;place-items:center;color:var(--muted)}
.search .clear:hover{background:var(--surface2)}
.search.has-value .clear{display:grid}
.search .clear .i{width:16px;height:16px}
.top-actions{display:flex;gap:8px;margin-left:auto;align-items:center}
.chip-btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);font-weight:600;font-size:13.5px;white-space:nowrap;transition:.15s}
.chip-btn:hover{background:var(--surface3)}
.chip-btn .i{width:18px;height:18px}
.icon-btn{width:44px;padding:0;justify-content:center}
.icon-btn.spin .i{animation:spin .8s linear infinite}
.tabs{display:flex;gap:6px;margin-top:14px;padding:4px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;width:max-content;max-width:100%}
.tab{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--muted);transition:.15s}
.tab .i{width:17px;height:17px}
.tab:hover{color:var(--text)}
.tab.active{background:var(--text);color:#0b0d12}
.genres{display:flex;gap:8px;overflow-x:auto;margin:12px -22px 0;padding:0 22px 2px;scrollbar-width:none;scroll-snap-type:x proximity}
.genres::-webkit-scrollbar{display:none}
.genre{flex-shrink:0;padding:8px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;scroll-snap-align:start;transition:.15s}
.genre:hover{color:var(--text);background:var(--surface2)}
.genre.active{background:var(--grad);color:#08130f;border-color:transparent}
.genre small{opacity:.65;margin-left:4px;font-weight:500}

.content{padding:18px 22px 40px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.hero h1{font-family:var(--display);font-size:30px;line-height:1.1;letter-spacing:-.035em;font-weight:800;display:flex;align-items:center;gap:12px}
.hero h1 .flag{width:34px;height:24px;border-radius:5px}
.hero h1 .flag.globe .i{width:28px;height:28px}
.hero p{margin-top:6px;font-size:13.5px;color:var(--muted)}
.meta-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.meta{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:6px 11px;border-radius:99px;white-space:nowrap}
.meta b{color:var(--text);font-weight:600}
.section-title{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.02em;margin:26px 0 14px;display:flex;align-items:center;gap:10px}
.section-title:first-child{margin-top:0}
.section-title .i{color:var(--accent)}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px}
.card{position:relative;padding:12px;border-radius:16px;background:var(--surface);border:1px solid transparent;cursor:pointer;transition:background .2s,transform .2s,border-color .2s;outline:none;content-visibility:auto;contain-intrinsic-size:240px}
.card:hover{background:var(--surface2);transform:translateY(-3px)}
.card:focus-visible{border-color:var(--accent)}
.card.playing{border-color:rgba(52,227,176,.45);background:linear-gradient(180deg,rgba(52,227,176,.1),rgba(255,255,255,.04))}
.cover{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(135deg,hsl(var(--h) 65% 42%),hsl(calc(var(--h) + 50) 70% 26%));box-shadow:0 10px 28px rgba(0,0,0,.35)}
.cover .initials{font-family:var(--display);font-size:38px;font-weight:800;color:rgba(255,255,255,.92);letter-spacing:-.04em;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:12%}
.cover img.full{object-fit:cover;padding:0}
.badge{position:absolute;left:8px;top:8px;z-index:2;font-size:10px;font-weight:700;letter-spacing:.04em;padding:4px 7px;border-radius:7px;background:rgba(8,10,14,.72);backdrop-filter:blur(6px);color:#fff}
.badge.off{background:rgba(255,107,129,.85)}
.fav{position:absolute;right:8px;top:8px;z-index:2;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(8,10,14,.62);backdrop-filter:blur(6px);color:#fff;transition:.15s}
.fav:hover{transform:scale(1.08)}
.fav .i{width:16px;height:16px}
.fav.on{color:var(--danger)}
.fab{position:absolute;right:10px;bottom:10px;z-index:2;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#06120d;box-shadow:0 8px 20px rgba(0,0,0,.4);opacity:0;transform:translateY(8px) scale(.9);transition:.2s}
.fab .i{width:20px;height:20px}
.card:hover .fab,.card:focus-visible .fab,.card.playing .fab{opacity:1;transform:none}
@media (hover:none){.fab{opacity:1;transform:none;width:40px;height:40px}}
.card-body{padding:12px 2px 2px}
.card h3{font-size:14.5px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card p{font-size:12.5px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:16px}
.eq span{width:3px;border-radius:2px;background:currentColor;animation:eq .9s ease-in-out infinite alternate}
.eq span:nth-child(2){animation-delay:-.3s}.eq span:nth-child(3){animation-delay:-.6s}.eq span:nth-child(4){animation-delay:-.15s}
.paused .eq span,.eq.still span{animation:none;height:5px}
@keyframes eq{0%{height:3px}100%{height:16px}}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}

.skeleton .cover{background:var(--surface2);box-shadow:none;animation:pulse 1.4s ease-in-out infinite}
.skeleton .line{height:12px;border-radius:6px;background:var(--surface2);margin-top:12px;animation:pulse 1.4s ease-in-out infinite}
.skeleton .line.short{width:60%;margin-top:8px}
@keyframes pulse{50%{opacity:.45}}
.empty{text-align:center;padding:64px 20px;color:var(--muted)}
.empty .big{width:64px;height:64px;border-radius:20px;margin:0 auto 16px;display:grid;place-items:center;background:var(--surface2);color:var(--accent)}
.empty .big .i{width:30px;height:30px}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
.empty .chip-btn{margin-top:18px;height:40px}
.more{display:flex;justify-content:center;padding:24px 0 8px}

/* ---------- player ---------- */
.player{position:fixed;left:10px;right:10px;bottom:10px;z-index:40;height:var(--player-h);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;padding:0 18px;
  background:rgba(16,19,26,.86);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 -10px 40px rgba(0,0,0,.35)}
.np{display:flex;align-items:center;gap:13px;min-width:0;text-align:left}
.np-cover{position:relative;width:58px;height:58px;border-radius:12px;overflow:hidden;flex-shrink:0;display:grid;place-items:center;background:linear-gradient(135deg,hsl(var(--h,160) 65% 42%),hsl(calc(var(--h,160) + 50) 70% 26%))}
.np-cover .initials{font-family:var(--display);font-weight:800;font-size:20px;color:#fff}
.np-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:10%}
.np-info{min-width:0}
.np-title{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-sub{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden}
.np-sub .txt{overflow:hidden;text-overflow:ellipsis}
.status{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--surface2);color:var(--muted);flex-shrink:0}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.status.playing{color:var(--accent);background:rgba(52,227,176,.12)}
.status.playing::before{animation:blink 1.6s infinite}
.status.loading,.status.buffering{color:var(--warn);background:rgba(255,195,92,.12)}
.status.error{color:var(--danger);background:rgba(255,107,129,.12)}
@keyframes blink{50%{opacity:.25}}
.p-fav{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.p-fav:hover{color:var(--text);background:var(--surface2)}
.p-fav.on{color:var(--danger)}
.p-center{display:flex;flex-direction:column;align-items:center;gap:8px}
.ctrls{display:flex;align-items:center;gap:10px}
.ctl{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:.15s}
.ctl:hover{color:var(--text);background:var(--surface2)}
.ctl.active{color:var(--accent)}
.ctl:disabled{opacity:.35;pointer-events:none}
.play-main{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--text);color:#0b0d12;transition:transform .15s;box-shadow:0 6px 20px rgba(255,255,255,.12)}
.play-main:hover{transform:scale(1.06)}
.play-main .i{width:22px;height:22px}
.live-line{display:flex;align-items:center;gap:10px;width:min(420px,32vw);font-size:11px;color:var(--soft);font-weight:600;letter-spacing:.04em}
.live-line .bar{flex:1;height:4px;border-radius:4px;background:var(--surface3);overflow:hidden;position:relative}
.live-line .bar::after{content:"";position:absolute;inset:0;background:var(--grad);transform-origin:left;transform:scaleX(0);transition:transform .4s}
.player.is-playing .live-line .bar::after{transform:scaleX(1)}
.player.is-loading .live-line .bar::after{transform:scaleX(.4);animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%) scaleX(.4)}100%{transform:translateX(250%) scaleX(.4)}}
.sleep-chip{color:var(--accent);display:none}
.sleep-chip.show{display:inline}
.p-right{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.vol{display:flex;align-items:center;gap:6px;color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;width:110px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--accent) var(--v,100%),var(--surface3) var(--v,100%));outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:50%;background:#fff}
.m-play{display:none}

/* ---------- mobile bottom nav ---------- */
.bnav{display:none}

/* ---------- sheets / modals ---------- */
.overlay{position:fixed;inset:0;z-index:70;background:rgba(4,6,10,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.overlay.open{opacity:1;visibility:visible}
.sheet{width:min(100%,460px);max-height:min(80vh,680px);display:flex;flex-direction:column;background:#131720;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5);transform:translateY(16px);transition:transform .25s}
.overlay.open .sheet{transform:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 12px}
.sheet-head h3{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.02em}
.close-x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted)}
.close-x:hover{color:var(--text)}
.sheet .mini-search{margin:0 18px 10px}
.sheet .country-list{padding:0 12px 14px;margin:0}
.sheet .c-btn{padding:11px 12px;font-size:14.5px}
.sleep-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 18px}
.sleep-grid button{padding:14px 8px;border-radius:14px;background:var(--surface2);font-weight:600;transition:.15s}
.sleep-grid button:hover{background:var(--surface3)}
.sleep-grid button.on{background:var(--grad);color:#08130f}
.sheet .note{padding:0 18px 12px;color:var(--muted);font-size:13px}
.sheet-foot{padding:14px 18px 18px;display:flex;gap:8px}
.sheet-foot button{flex:1;padding:13px;border-radius:14px;background:var(--surface2);font-weight:600}
.sheet-foot .danger{background:rgba(255,107,129,.14);color:var(--danger)}

/* video */
#videoModal .vbox{width:min(100%,1100px);background:#0d1016;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.vhead{display:flex;align-items:center;gap:12px;padding:12px 14px}
.vhead .t{flex:1;min-width:0}
.vhead .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vhead .t span{font-size:12px;color:var(--muted)}
.vstage{position:relative;background:#000;aspect-ratio:16/9;max-height:74vh}
.vstage video{width:100%;height:100%;display:block;background:#000}
.vmsg{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;color:var(--muted);background:rgba(0,0,0,.6)}
.vmsg.show{display:flex}
.vmsg b{color:var(--text);font-size:16px}
.vmsg .spinner{width:34px;height:34px;color:var(--accent);border-width:3px}

/* full now-playing (mobile) */
.fullnp{position:fixed;inset:0;z-index:65;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 22px calc(var(--safe-b) + 24px);background:#0b0d12;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.fullnp.open{transform:none}
.fullnp .bgblur{position:absolute;inset:-20%;background:radial-gradient(60% 50% at 50% 30%,hsl(var(--h,160) 70% 40% / .55),transparent 70%);filter:blur(30px);pointer-events:none}
.fullnp>*{position:relative}
.fn-top{display:flex;align-items:center;justify-content:space-between}
.fn-top span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.fullnp .fn-art{margin:auto;width:min(78vw,340px,48vh);height:auto;aspect-ratio:1;border-radius:26px;box-shadow:0 30px 70px rgba(0,0,0,.55)}
.fullnp .fn-art .initials{font-size:clamp(48px,18vw,88px)}
.fullnp.open ~ .toasts{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 64px)}
.fn-meta{display:flex;align-items:center;gap:12px;margin-top:8px}
.fn-meta .txt{flex:1;min-width:0}
.fn-meta h2{font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fn-meta p{color:var(--muted);margin-top:6px;font-size:14px;display:flex;gap:8px;align-items:center}
.fn-ctrls{display:flex;align-items:center;justify-content:space-between;margin:28px 6px 0}
.fn-ctrls .ctl{width:52px;height:52px}
.fn-ctrls .ctl .i{width:24px;height:24px}
.fn-ctrls .play-main{width:76px;height:76px}
.fn-ctrls .play-main .i{width:32px;height:32px}
.fn-extra{display:flex;justify-content:space-around;margin-top:26px}
.fn-extra button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:600;padding:6px 10px;border-radius:12px}
.fn-extra button.active{color:var(--accent)}
.fn-vol{display:flex;align-items:center;gap:12px;margin-top:24px;color:var(--muted)}
.fn-vol input{flex:1;width:auto}

.toasts{position:fixed;left:50%;bottom:calc(var(--player-h) + var(--nav-h) + var(--safe-b) + 26px);transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{display:flex;align-items:center;gap:9px;padding:11px 16px;border-radius:14px;background:#1c212c;border:1px solid var(--line);font-size:13.5px;font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,.4);animation:tin .25s ease}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0}
.toast.success::before{background:var(--accent)}.toast.error::before{background:var(--danger)}.toast.warn::before{background:var(--warn)}
.toast.out{opacity:0;transform:translateY(6px);transition:.25s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  :root{--side:226px}
  .player{grid-template-columns:minmax(0,1fr) auto auto}
  .vol input{width:80px}
}
@media (max-width:900px){
  :root{--player-h:66px;--nav-h:62px}
  .app{display:block;height:auto;padding:0;padding-bottom:calc(var(--player-h) + var(--nav-h) + var(--safe-b) + 24px)}
  .sidebar{display:none}
  .main{border:none;border-radius:0;background:none;overflow:visible}
  .scroller{overflow:visible}
  .header{padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px}
  .m-brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.03em}
  .m-brand .brand-mark{width:32px;height:32px;border-radius:10px}
  .m-brand .brand-mark span{width:13px;height:13px;border-width:3.5px}
  .top-row{flex-wrap:wrap}
  .search{order:3;flex-basis:100%;max-width:none;margin-top:10px}
  .search input{height:42px}
  .chip-btn{height:38px;padding:0 12px;border-radius:12px;font-size:13px}
  .icon-btn{width:38px}
  .tabs{display:none}
  .genres{margin:10px -16px 0;padding:0 16px 2px}
  .content{padding:14px 16px 20px}
  .hero{flex-direction:column;align-items:flex-start;gap:10px;margin-bottom:14px}
  .hero h1{font-size:24px}
  .meta-row{justify-content:flex-start}
  .grid{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
  .card{padding:10px}
  .card:hover{transform:none}
  .player{left:8px;right:8px;bottom:calc(var(--nav-h) + var(--safe-b) + 6px);height:var(--player-h);grid-template-columns:minmax(0,1fr) auto auto;gap:4px;padding:0 6px 0 8px;border-radius:16px}
  .np-cover{width:48px;height:48px;border-radius:10px}
  .np-title{font-size:14px}
  .p-center,.p-right{display:none}
  .m-play{display:grid;width:44px;height:44px;border-radius:50%;place-items:center;background:var(--text);color:#0b0d12}
  .m-play .i{width:20px;height:20px}
  .bnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);background:rgba(10,12,17,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line)}
  .bnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;color:var(--soft)}
  .bnav button .i{width:22px;height:22px}
  .bnav button.active{color:var(--text)}
  .bnav button.active .i{color:var(--accent)}
  .overlay.bottom{align-items:flex-end;padding:0}
  .overlay.bottom .sheet{width:100%;max-width:none;border-radius:24px 24px 0 0;max-height:82vh;padding-bottom:var(--safe-b);transform:translateY(100%)}
  .overlay.bottom.open .sheet{transform:none}
  #videoModal{padding:0}
  #videoModal .vbox{border-radius:0;border:none;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;background:#000}
  #videoModal .vhead{position:absolute;top:0;left:0;right:0;z-index:2;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;background:linear-gradient(180deg,rgba(0,0,0,.8),transparent)}
  .vstage{max-height:none}
}
@media (max-width:380px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top-actions .lbl{display:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

/* ---------- helpers ---------- */
const esc = (t='')=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toHttps = u => (u||'').trim().replace(/^http:\/\//i,'https://');
const uniq = a => [...new Set(a.filter(Boolean))];
const keyOf = ch => `${ch.type}|${ch.country}|${ch.name}`;
const country = code => COUNTRIES.find(c=>c.code===code) || {code, name:code};
const icon = (id,cls='i') => `<svg class="${cls}"><use href="#i-${id}"/></svg>`;
const flagHtml = (code,cls='flag') => code==='ALL'||!/^[A-Z]{2}$/.test(code||'')
  ? `<span class="${cls} globe">${icon('globe')}</span>`
  : `<img class="${cls}" src="https://flagcdn.com/w40/${code.toLowerCase()}.png" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`;
function hue(str=''){let h=0;for(const c of str)h=(h*31+c.charCodeAt(0))%360;return h}
function initials(name=''){
  const w=name.replace(/[^\p{L}\p{N} ]/gu,' ').trim().split(/\s+/).filter(Boolean);
  if(!w.length) return '♪';
  return (w.length>1 ? w[0][0]+w[1][0] : w[0].slice(0,2)).toUpperCase();
}
function deriveGenre(text=''){
  const t=String(text).toLowerCase();
  if(/news|haber|information|actualit|nachricht|talk/.test(t))return'Haber';
  if(/sport|spor/.test(t))return'Spor';
  if(/classical|klasik|klassik|opera|baroque/.test(t))return'Klasik';
  if(/jazz|caz|blues|soul/.test(t))return'Caz & Blues';
  if(/rock|metal|alternative|indie|punk/.test(t))return'Rock';
  if(/arabesk|türkü|turku|halk|folk|fasıl|fasil|tsm|thm/.test(t))return'Türk & Halk';
  if(/kids|child|çocuk|cocuk|animation/.test(t))return'Çocuk';
  if(/quran|kuran|relig|islam|dini|christian|gospel|church/.test(t))return'Dini';
  if(/document|belgesel|culture|kültür|education/.test(t))return'Belgesel & Kültür';
  if(/oldies|nostalji|retro|80s|90s|70s|60s/.test(t))return'Nostalji';
  if(/dance|electro|house|techno|trance|edm|lounge|chill/.test(t))return'Elektronik';
  if(/hip.?hop|rap|r&b|rnb/.test(t))return'Hip-Hop';
  if(/movie|film|cinema|series|dizi|entertain/.test(t))return'Film & Dizi';
  if(/music|müzik|muzik/.test(t) && /tv/.test(t))return'Müzik';
  return'Pop';
}
function fetchTimeout(url,ms=9000,opts={}){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms);
  return fetch(url,{...opts,signal:c.signal}).finally(()=>clearTimeout(t));
}
let toastTimer;
function toast(msg,type=''){
  const wrap=$('#toasts');
  while(wrap.children.length>=2) wrap.firstChild.remove();
  const el=document.createElement('div'); el.className=`toast ${type}`; el.textContent=msg; wrap.appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),260)},3000);
}

/* ---------- favorites / recent ---------- */
const getFavs = ()=>LS.get('orbis_favorites',[]).map(normalizeSaved).filter(Boolean);
const setFavs = v=>LS.set('orbis_favorites',v);
const isFav = ch=>!!ch && getFavs().some(x=>x.id===keyOf(ch));
const getRecent = ()=>LS.get('orbis_recent',[]).map(normalizeSaved).filter(Boolean);
function normalizeSaved(x){
  if(!x||!x.name) return null;
  const urls=uniq(x.urls||[toHttps(x.url),x.url]);
  if(!urls.length) return null;
  return {...x, type:x.type||'radio', urls, id:keyOf({type:x.type||'radio',country:x.country,name:x.name})};
}
function slim(ch){const {type,name,urls,logo,country,countryName,genre,tags,quality,uuid,codec,bitrate,hls}=ch;return {id:keyOf(ch),type,name,urls,logo,country,countryName,genre,tags,quality,uuid,codec,bitrate,hls}}
function toggleFav(ch){
  if(!ch) return;
  const list=getFavs(), id=keyOf(ch), i=list.findIndex(x=>x.id===id);
  if(i>=0){list.splice(i,1);toast('Favorilerden çıkarıldı')}
  else{list.unshift(slim(ch));toast('Favorilere eklendi','success')}
  setFavs(list);
  updateFavCount();
  if(state.tab==='favorites'){state.channels=getFavs();renderGenres();renderGrid()} else markCards();
  renderPlayer();
}
function addRecent(ch){
  const list=getRecent().filter(x=>x.id!==keyOf(ch)); list.unshift(slim(ch)); LS.set('orbis_recent',list.slice(0,18));
}
function updateFavCount(){ $('#favCount').textContent=getFavs().length }

/* ---------- data: radio ---------- */
async function rbFetch(path){
  const pref=LS.get('orbis_rb_host',null);
  const hosts=uniq([pref,...RB_HOSTS]);
  let lastErr;
  for(const h of hosts){
    try{
      const r=await fetchTimeout(`https://${h}${path}`,8000,{headers:{'Accept':'application/json'}});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const data=await r.json();
      LS.set('orbis_rb_host',h);
      return {data,host:h};
    }catch(e){lastErr=e}
  }
  throw lastErr||new Error('Radyo sunucularına ulaşılamadı');
}
async function fetchRadio(cc){
  const cacheKey=`orbis_radio_v2_${cc}`;
  const cached=LS.get(cacheKey,null);
  if(cached && Date.now()-cached.time<CACHE_TTL){state.source='Radio Browser · önbellek';return cached.items}
  const base='/json/stations/search?hidebroken=true&order=clickcount&reverse=true&limit=400';
  const {data}=await rbFetch(cc==='ALL'?base:`${base}&countrycode=${cc}`);
  const seen=new Set(), items=[];
  for(const x of data){
    if(x.lastcheckok===0) continue;
    const raw=x.url_resolved||x.url; if(!raw) continue;
    const name=(x.name||'').replace(/\s+/g,' ').trim(); if(!name) continue;
    const dk=name.toLowerCase(); if(seen.has(dk)) continue; seen.add(dk);
    items.push({
      type:'radio', uuid:x.stationuuid, name,
      urls:uniq([toHttps(x.url_resolved),toHttps(x.url),x.url_resolved,x.url]),
      secure:/^https:/i.test(raw),
      logo:x.favicon?toHttps(x.favicon):'',
      country:x.countrycode||cc, countryName:country(x.countrycode||cc).name||x.country,
      genre:deriveGenre(`${x.tags} ${name}`), tags:[x.tags,x.state].filter(Boolean).join(' '),
      codec:x.codec||'', bitrate:x.bitrate||0, hls:x.hls===1
    });
  }
  // HTTPS yayınlar sayfada sorunsuz çalışır; onları öne al (popülerlik sırası korunur)
  items.sort((a,b)=>(b.secure-a.secure));
  const out=items.slice(0,320);
  LS.set(cacheKey,{time:Date.now(),items:out});
  state.source='Radio Browser · canlı';
  return out;
}

/* ---------- data: tv ---------- */
function parseM3U(text,cc){
  const out=[], seen=new Set(); let meta=null;
  for(const raw of text.split(/\r?\n/)){
    const line=raw.trim(); if(!line) continue;
    if(line.startsWith('#EXTINF')){
      const attr=n=>(line.match(new RegExp(n+'="([^"]*)"'))||[])[1]||'';
      const cut=line.lastIndexOf('",');
      let name=(cut>-1?line.slice(cut+2):line.slice(line.indexOf(',')+1)).trim();
      meta={name,logo:attr('tvg-logo'),group:attr('group-title'),headers:false};
    }else if(line.startsWith('#EXTVLCOPT')||line.startsWith('#KODIPROP')){
      if(meta && /referrer|user-agent|license/i.test(line)) meta.headers=true;
    }else if(meta && /^https?:\/\//i.test(line)){
      if(!meta.headers){
        const geo=/\[geo-blocked\]/i.test(meta.name), part=/\[not 24\/7\]/i.test(meta.name);
        const quality=(meta.name.match(/\((\d{3,4}p)\)/i)||[])[1]||'';
        const name=meta.name.replace(/\[[^\]]*\]/g,'').replace(/\(\d{3,4}p\)/ig,'').replace(/\s+/g,' ').trim()||'İsimsiz TV';
        const dk=name.toLowerCase();
        if(!seen.has(dk)){
          seen.add(dk);
          out.push({type:'tv',name,urls:uniq([toHttps(line),line]),secure:/^https:/i.test(line),logo:toHttps(meta.logo),
            country:cc,countryName:country(cc).name,genre:deriveGenre(`${meta.group} ${name}`),tags:meta.group||'',quality,geo,part});
        }
      }
      meta=null;
    }
  }
  out.sort((a,b)=>(b.secure-a.secure)||(a.geo-b.geo)||(a.part-b.part));
  return out;
}
async function fetchTVCountry(cc){
  const cacheKey=`orbis_tv_v2_${cc}`;
  const cached=LS.get(cacheKey,null);
  if(cached && Date.now()-cached.time<CACHE_TTL) return {items:cached.items,cached:true};
  const lc=cc.toLowerCase();
  const urls=[`https://iptv-org.github.io/iptv/countries/${lc}.m3u`,`https://raw.githubusercontent.com/iptv-org/iptv/master/streams/${lc}.m3u`];
  for(const u of urls){
    try{
      const r=await fetchTimeout(u,12000);
      if(!r.ok) continue;
      const t=await r.text();
      if(!t.includes('#EXTINF')) continue;
      const items=parseM3U(t,cc).slice(0,300);
      LS.set(cacheKey,{time:Date.now(),items});
      return {items,cached:false};
    }catch{}
  }
  throw new Error('TV listesi alınamadı');
}
async function fetchTV(cc){
  if(cc==='ALL'){
    const sample=['TR','GB','US','DE','FR','IT','ES','AZ','JP','IN'];
    const res=await Promise.allSettled(sample.map(fetchTVCountry));
    const items=res.flatMap(r=>r.status==='fulfilled'?r.value.items.slice(0,30):[]);
    if(!items.length) throw new Error('TV listesi alınamadı');
    state.source='iptv-org · çok ülkeli';
    return items;
  }
  const {items,cached}=await fetchTVCountry(cc);
  state.source=`iptv-org · ${cached?'önbellek':'canlı'}`;
  return items;
}

/* ---------- load ---------- */
async function loadChannels(force=false){
  const token=++state.loadToken;
  LS.set('orbis_tab',state.tab); LS.set('orbis_country',state.country);
  state.genre='Tümü'; state.shown=PAGE; state.error=false;
  if(state.tab==='favorites'){
    state.channels=getFavs(); state.loading=false; state.source='Bu cihazda kayıtlı';
    renderAll(); return;
  }
  if(force){LS.del(`orbis_radio_v2_${state.country}`);LS.del(`orbis_tv_v2_${state.country}`)}
  state.loading=true; renderAll();
  $('#reloadBtn').classList.add('spin');
  try{
    const items= state.tab==='tv' ? await fetchTV(state.country) : await fetchRadio(state.country);
    if(token!==state.loadToken) return;
    state.channels=items;
  }catch(e){
    if(token!==state.loadToken) return;
    state.channels=[]; state.error=true; state.source='Bağlantı hatası';
    toast('Kanal listesi alınamadı. İnternetini kontrol edip yenile.','error');
  }finally{
    if(token===state.loadToken){state.loading=false;$('#reloadBtn').classList.remove('spin');renderAll()}
  }
}

/* ---------- render ---------- */
function filtered(){
  let list=state.tab==='favorites'?getFavs():state.channels;
  if(state.genre!=='Tümü') list=list.filter(x=>x.genre===state.genre);
  if(state.query){
    const q=state.query.toLocaleLowerCase('tr');
    list=list.filter(x=>`${x.name} ${x.genre} ${x.countryName||''} ${x.tags||''}`.toLocaleLowerCase('tr').includes(q));
  }
  return list;
}
function renderAll(){renderTabs();renderCountries();renderGenres();renderGrid();renderPlayer();updateFavCount()}
function renderTabs(){
  $$('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));
  const c=country(state.country);
  $('#countryBtn').innerHTML=`${flagHtml(c.code)}<span class="lbl">${esc(c.name)}</span>${icon('down')}`;
  $('#countryBtn').style.display=state.tab==='favorites'?'none':'';
  $('#reloadBtn').style.display=state.tab==='favorites'?'none':'';
}
function countryButtons(q){
  q=(q||'').toLocaleLowerCase('tr');
  const list=COUNTRIES.filter(c=>`${c.name} ${c.code}`.toLocaleLowerCase('tr').includes(q));
  if(!list.length) return `<div class="empty" style="padding:24px">Ülke bulunamadı</div>`;
  return list.map(c=>`<button class="c-btn ${state.country===c.code?'active':''}" data-country="${c.code}">${flagHtml(c.code)}<span>${esc(c.name)}</span><span class="code">${c.code==='ALL'?'':c.code}</span></button>`).join('');
}
function renderCountries(){
  $('#sideCountries').innerHTML=countryButtons($('#sideCountrySearch').value);
  $('#sheetCountries').innerHTML=countryButtons($('#sheetCountrySearch').value);
}
function renderGenres(){
  const el=$('#genres');
  if(state.loading||!state.channels.length){el.innerHTML='';el.style.display='none';return}
  const counts={}; state.channels.forEach(x=>counts[x.genre]=(counts[x.genre]||0)+1);
  const gs=Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([g])=>g);
  if(gs.length<2){el.innerHTML='';el.style.display='none';return}
  el.style.display='';
  el.innerHTML=[['Tümü',state.channels.length],...gs.map(g=>[g,counts[g]])]
    .map(([g,n])=>`<button class="genre ${state.genre===g?'active':''}" data-genre="${esc(g)}">${esc(g)}<small>${n}</small></button>`).join('');
}
function coverHtml(ch,extra=''){
  const ini=esc(initials(ch.name));
  const img=ch.logo?`<img src="${esc(ch.logo)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">`:'';
  return `<div class="cover" style="--h:${hue(ch.name)}"><span class="initials">${ini}</span>${img}${extra}</div>`;
}
function cardHtml(ch){
  const k=keyOf(ch), fav=isFav(ch), off=broken.has(k);
  const badge = off ? '<span class="badge off">ERİŞİLEMİYOR</span>'
    : ch.type==='tv' ? `<span class="badge">${esc(ch.quality||'TV')}${ch.geo?' · bölge kısıtlı':''}</span>`
    : (ch.bitrate ? `<span class="badge">${ch.bitrate} kbps</span>` : '');
  const fab=`<span class="fab">${icon('play')}</span>`;
  const favBtn=`<button class="fav ${fav?'on':''}" data-act-card="fav" aria-label="${fav?'Favorilerden çıkar':'Favorilere ekle'}">${icon(fav?'heart-f':'heart')}</button>`;
  const sub=[ch.genre, state.tab!=='radio'&&state.tab!=='tv'||state.country==='ALL'?ch.countryName:'', ch.type==='radio'&&ch.codec?ch.codec:''].filter(Boolean).join(' · ');
  return `<article class="card" role="button" tabindex="0" data-key="${esc(k)}" aria-label="${esc(ch.name)} oynat">${coverHtml(ch,badge+favBtn+fab)}<div class="card-body"><h3 title="${esc(ch.name)}">${esc(ch.name)}</h3><p>${esc(sub)}</p></div></article>`;
}
function skeleton(n=12){return `<div class="grid">${Array.from({length:n},()=>'<div class="card skeleton"><div class="cover"></div><div class="line"></div><div class="line short"></div></div>').join('')}</div>`}
function renderGrid(){
  const c=country(state.country), list=filtered(), wrap=$('#gridWrap');
  const title=$('#pageTitle');
  if(state.tab==='favorites'){title.innerHTML='Favorilerin';$('#pageSub').textContent='Kalbe dokunduğun kanallar bu cihazda saklanır.'}
  else{
    title.innerHTML=`${flagHtml(c.code)}<span>${esc(c.name)} · ${state.tab==='tv'?'TV':'Radyo'}</span>`;
    $('#pageSub').textContent=state.tab==='tv'?'Bir kanala dokun, yayın tam ekran açılsın.':'Bir istasyona dokun, hemen dinlemeye başla.';
  }
  $('#countMeta').innerHTML=state.loading?'Yükleniyor…':`<b>${list.length}</b> kanal`;
  $('#sourceMeta').textContent=state.source?`Kaynak: ${state.source}`:'';
  $('#sourceMeta').style.display=state.source?'':'none';

  if(state.loading){wrap.innerHTML=skeleton();return}
  if(state.tab==='favorites'){
    const favs=filtered(), recent=getRecent().filter(r=>!state.query||`${r.name} ${r.genre}`.toLocaleLowerCase('tr').includes(state.query.toLocaleLowerCase('tr')));
    let html='';
    html+=`<h2 class="section-title">${icon('heart-f')}Favoriler</h2>`;
    html+=favs.length?`<div class="grid">${favs.map(cardHtml).join('')}</div>`
      :`<div class="empty" style="padding:30px 20px"><div class="big">${icon('heart')}</div><b>Henüz favorin yok</b>Kartlardaki kalbe dokunarak ekleyebilirsin.</div>`;
    if(recent.length) html+=`<h2 class="section-title">${icon('clock')}Son çalınanlar</h2><div class="grid">${recent.map(cardHtml).join('')}</div>`;
    wrap.innerHTML=html; markCards(); return;
  }
  if(state.error){
    wrap.innerHTML=`<div class="empty"><div class="big">${icon('alert')}</div><b>Liste yüklenemedi</b>Kaynak sunucuya şu an ulaşılamıyor.<br><button class="chip-btn" data-retry>${icon('refresh')}Tekrar dene</button></div>`;return;
  }
  if(!list.length){
    wrap.innerHTML=`<div class="empty"><div class="big">${icon('search')}</div><b>Sonuç bulunamadı</b>${state.query?'Aramayı değiştir ya da':'Bu ülke için yayın yok,'} başka bir ülke seç.</div>`;return;
  }
  const shown=list.slice(0,state.shown);
  wrap.innerHTML=`<div class="grid">${shown.map(cardHtml).join('')}</div>`+
    (list.length>shown.length?`<div class="more"><button class="chip-btn" data-more>Daha fazla göster (${list.length-shown.length})</button></div>`:'');
  markCards(); observeMore();
}
let io;
function observeMore(){
  if(io) io.disconnect();
  const btn=$('[data-more]'); if(!btn||!('IntersectionObserver' in window)) return;
  io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){io.disconnect();state.shown+=PAGE;renderGrid()}},{rootMargin:'400px'});
  io.observe(btn);
}
function markCards(){
  const cur=state.current?keyOf(state.current):null;
  const favIds=new Set(getFavs().map(x=>x.id));
  $$('.card[data-key]').forEach(card=>{
    const k=card.dataset.key, playing=k===cur;
    card.classList.toggle('playing',playing);
    card.classList.toggle('paused',playing&&state.status!=='playing');
    const fab=$('.fab',card);
    if(fab){
      const want= playing ? (state.status==='loading'||state.status==='buffering'?'load':state.status==='playing'?'eq':'play') : 'play';
      if(fab.dataset.mode!==want){
        fab.dataset.mode=want;
        fab.innerHTML= want==='load'?'<span class="spinner"></span>':want==='eq'?'<span class="eq"><span></span><span></span><span></span><span></span></span>':icon('play');
      }
    }
    const fb=$('.fav',card);
    if(fb){const on=favIds.has(k); if(fb.classList.contains('on')!==on){fb.classList.toggle('on',on);fb.innerHTML=icon(on?'heart-f':'heart')}}
  });
}
const STATUS_TXT={idle:'Hazır',loading:'Bağlanıyor',buffering:'Yükleniyor',playing:'Canlı',paused:'Duraklatıldı',error:'Hata'};
function setCover(el,ch){
  if(!ch){el.style.removeProperty('--h');el.innerHTML='<span class="initials">♪</span>';return}
  el.style.setProperty('--h',hue(ch.name));
  el.innerHTML=`<span class="initials">${esc(initials(ch.name))}</span>`+(ch.logo?`<img src="${esc(ch.logo)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:'');
}
function renderPlayer(){
  const ch=state.current, s=state.status;
  const player=$('#player');
  player.classList.toggle('is-playing',s==='playing');
  player.classList.toggle('is-loading',s==='loading'||s==='buffering');
  const curKey=ch?keyOf(ch):'';
  if(player.dataset.key!==curKey){
    player.dataset.key=curKey;
    setCover($('#npCover'),ch); setCover($('#fnArt'),ch);
    $('#fullNp').style.setProperty('--h',ch?hue(ch.name):160);
  }
  $('#npTitle').textContent=ch?ch.name:'Bir kanal seç';
  $('#fnTitle').textContent=ch?ch.name:'Bir kanal seç';
  const sub=ch?[ch.genre,ch.countryName].filter(Boolean).join(' · '):'Radyo veya TV';
  $('#npSub').textContent=sub; $('#fnSub').textContent=sub;
  ['#npStatus','#fnStatus'].forEach(sel=>{const el=$(sel);el.className=`status ${s}`;el.textContent=STATUS_TXT[s]||''});
  const busy=s==='loading'||s==='buffering';
  const playIcon= busy?'<span class="spinner"></span>' : icon(s==='playing'?'pause':'play');
  $$('[data-act="toggle"]').forEach(b=>{
    const mode=busy?'busy':s==='playing'?'pause':'play';
    if(b.dataset.mode!==mode){b.dataset.mode=mode;b.innerHTML=playIcon;b.setAttribute('aria-label',s==='playing'?'Duraklat':'Oynat')}
  });
  const fav=isFav(ch);
  $$('[data-act="fav"]').forEach(b=>{b.classList.toggle('on',fav);const u=$('use',b);if(u)u.setAttribute('href',fav?'#i-heart-f':'#i-heart')});
  $$('[data-act="pip"]').forEach(b=>b.disabled=!(ch&&ch.type==='tv'&&document.pictureInPictureEnabled));
  $$('[data-act="prev"],[data-act="next"],[data-act="stop"]').forEach(b=>b.disabled=!ch);
  $$('[data-act="sleep"]').forEach(b=>b.classList.toggle('active',!!state.sleepEnd));
  document.title=ch&&s==='playing'?`▶ ${ch.name} · Orbis`:'Orbis · Canlı Radyo & TV';
  updateMediaSession();
  markCards();
}

/* ---------- playback ---------- */
let HlsLib=null, hlsLoading=null;
const hls={audio:null,video:null};
function loadHls(){
  if(HlsLib) return Promise.resolve(HlsLib);
  if(!hlsLoading) hlsLoading=new Promise(res=>{
    const s=document.createElement('script'); s.src=HLS_SRC; s.async=true;
    s.onload=()=>{HlsLib=window.Hls||null;res(HlsLib)}; s.onerror=()=>{hlsLoading=null;res(null)};
    document.head.appendChild(s);
  });
  return hlsLoading;
}
function detach(el){
  const k=el===audio?'audio':'video';
  if(hls[k]){try{hls[k].destroy()}catch{} hls[k]=null}
  el.pause(); el.removeAttribute('src'); try{el.load()}catch{}
}
async function attach(el,src,hlsHint=false){
  detach(el);
  const k=el===audio?'audio':'video';
  // TV yayınlarının neredeyse tamamı HLS'tir; uzantısı olmayan adresleri de HLS olarak dene
  const isHls=hlsHint||/\.m3u8(\?|$)/i.test(src)||(el===video&&!/\.(mp4|webm|ogv|ogg)(\?|$)/i.test(src));
  if(isHls && !el.canPlayType('application/vnd.apple.mpegurl')){
    const H=await loadHls();
    if(H && H.isSupported()){
      const h=new H({enableWorker:true,maxBufferLength:30,manifestLoadingTimeOut:12000,fragLoadingTimeOut:20000});
      hls[k]=h;
      h.on(H.Events.ERROR,(_,d)=>{if(d&&d.fatal) el.dispatchEvent(new Event('hlsfatal'))});
      h.loadSource(src); h.attachMedia(el);
      return;
    }
  }
  el.src=src;
}
function waitPlaying(el,ms){
  return new Promise((resolve,reject)=>{
    let done=false;
    const finish=(fn,arg)=>{if(done)return;done=true;clearTimeout(t);['playing','error','hlsfatal'].forEach((e,i)=>el.removeEventListener(e,[ok,bad,bad][i]));fn(arg)};
    const ok=()=>finish(resolve);
    const bad=()=>finish(reject,new Error('media'));
    const t=setTimeout(()=>finish(reject,new Error('timeout')),ms);
    el.addEventListener('playing',ok); el.addEventListener('error',bad); el.addEventListener('hlsfatal',bad);
    const p=el.play();
    if(p&&p.catch) p.catch(err=>{ if(err&&err.name==='NotAllowedError') finish(reject,err); });
  });
}
function setStatus(s){ if(state.status!==s){state.status=s;renderPlayer()} }
function markBroken(ch,on=true){
  const k=keyOf(ch); on?broken.add(k):broken.delete(k);
  try{sessionStorage.setItem('orbis_broken',JSON.stringify([...broken]))}catch{}
}

async function play(ch){
  if(!ch) return;
  const token=++state.token;
  state.current=ch; state.retried=false;
  addRecent(ch);
  setStatus('loading');
  const isTV=ch.type==='tv', el=isTV?video:audio, other=isTV?audio:video;
  detach(other);
  if(isTV) openVideo(ch); else closeVideo(true);
  const urls=ch.urls&&ch.urls.length?ch.urls:[ch.url];
  for(const src of urls){
    if(token!==state.token) return;
    try{
      await attach(el,src,!!ch.hls);
      if(token!==state.token) return;
      await waitPlaying(el,isTV?18000:12000);
      if(token!==state.token) return;
      if(broken.has(keyOf(ch))){markBroken(ch,false);if(state.tab!=='favorites')renderGrid()}
      setStatus('playing'); setVMsg('');
      if(ch.uuid) pingClick(ch.uuid);
      return;
    }catch(err){
      if(token!==state.token) return;
      if(err&&err.name==='NotAllowedError'){setStatus('paused');setVMsg('');toast('Başlatmak için oynat tuşuna dokun','warn');return}
    }
  }
  if(token!==state.token) return;
  detach(el);
  markBroken(ch); setStatus('error');
  if(isTV) setVMsg('error');
  toast(isTV?'Bu kanal şu an yayın vermiyor ya da bölgende kısıtlı.':'Bu istasyon şu an yanıt vermiyor. Sonrakini dene.','error');
  if(state.tab!=='favorites') renderGrid(); else markCards();
}
function pingClick(uuid){
  const h=LS.get('orbis_rb_host','de2.api.radio-browser.info');
  fetchTimeout(`https://${h}/json/url/${encodeURIComponent(uuid)}`,6000).catch(()=>{});
}
function stopAll(){
  state.token++;
  detach(audio); detach(video); closeVideo(true);
  state.current=null; setStatus('idle'); renderPlayer();
}
function toggle(){
  const ch=state.current;
  if(!ch){const l=filtered(); if(l.length) play(l[0]); else toast('Önce bir kanal seç'); return}
  if(state.status==='error'||state.status==='idle') return play(ch);
  const el=ch.type==='tv'?video:audio;
  if(ch.type==='tv' && !$('#videoModal').classList.contains('open')) openVideo(ch);
  if(el.paused||state.status==='paused'){
    // Canlı yayında uzun duraklamadan sonra en güncel noktaya bağlan
    if(ch.type==='radio' && !hls.audio){ return play(ch) }
    setStatus('loading'); el.play().catch(()=>setStatus('paused'));
  } else el.pause();
}
function navList(){
  const ch=state.current; if(!ch) return [];
  let l=filtered().filter(x=>x.type===ch.type);
  if(!l.some(x=>keyOf(x)===keyOf(ch))) l=state.channels.filter(x=>x.type===ch.type);
  return l;
}
function step(dir){
  const l=navList(); if(!l.length) return;
  const i=l.findIndex(x=>keyOf(x)===keyOf(state.current));
  play(l[(i+dir+l.length)%l.length]);
}
function shuffle(){
  let l=state.current?navList():filtered(); if(!l.length) l=filtered(); if(!l.length) return;
  const cand=l.filter(x=>!broken.has(keyOf(x))&&(!state.current||keyOf(x)!==keyOf(state.current)));
  const pool=cand.length?cand:l; play(pool[Math.floor(Math.random()*pool.length)]);
}

[audio,video].forEach(el=>{
  el.addEventListener('waiting',()=>{if(state.current&&state.status==='playing'&&(el===audio)===(state.current.type==='radio'))setStatus('buffering')});
  el.addEventListener('playing',()=>{if(state.current&&(el===audio)===(state.current.type==='radio')){setStatus('playing');setVMsg('')}});
  el.addEventListener('pause',()=>{if(state.current&&(el===audio)===(state.current.type==='radio')&&['playing','buffering'].includes(state.status))setStatus('paused')});
  const lost=()=>{
    const ch=state.current;
    if(!ch||(el===audio)!==(ch.type==='radio')) return;
    if(!['playing','buffering'].includes(state.status)) return;
    if(!state.retried){state.retried=true;toast('Bağlantı koptu, yeniden bağlanılıyor…','warn');const t=state.token;setTimeout(()=>{if(t===state.token){const r=state.retried;play(ch).then(()=>{state.retried=r})}},800)}
    else{setStatus('error');toast('Yayın kesildi','error')}
  };
  el.addEventListener('error',lost); el.addEventListener('hlsfatal',lost);
});

/* ---------- video modal ---------- */
function openVideo(ch){
  $('#vTitle').textContent=ch.name;
  $('#vSub').textContent=[ch.quality,ch.genre,ch.countryName].filter(Boolean).join(' · ');
  setVMsg('loading');
  openOverlay('#videoModal');
}
function closeVideo(silent){
  $('#videoModal').classList.remove('open');
  if(!silent && state.current&&state.current.type==='tv'){
    if(document.pictureInPictureElement===video) return; // PiP'te izlemeye devam
    stopAll();
  }
}
function setVMsg(kind){
  const m=$('#vMsg');
  if(!kind){m.className='vmsg';m.innerHTML='';return}
  m.className='vmsg show';
  m.innerHTML= kind==='loading'
    ? '<span class="spinner"></span><span>Yayına bağlanılıyor…</span>'
    : `<b>Yayın açılamadı</b><span>Kanal şu an kapalı olabilir ya da bölgende kısıtlı.</span><div style="display:flex;gap:8px;margin-top:6px"><button class="chip-btn" data-act="toggle" style="height:38px">${icon('refresh')}Tekrar dene</button><button class="chip-btn" data-act="next" style="height:38px">${icon('next')}Sonraki kanal</button></div>`;
}
async function togglePiP(){
  if(!state.current||state.current.type!=='tv') return toast('PiP yalnızca TV yayınlarında kullanılabilir');
  try{
    if(document.pictureInPictureElement) await document.exitPictureInPicture();
    else{await video.requestPictureInPicture(); $('#videoModal').classList.remove('open')}
  }catch{toast('Tarayıcın PiP desteklemiyor','error')}
}
video.addEventListener('leavepictureinpicture',()=>{if(state.current&&state.current.type==='tv'&&!video.paused)openOverlay('#videoModal')});

/* ---------- sleep timer ---------- */
function startSleep(min){
  clearTimeout(state.sleepTimer);
  state.sleepEnd=Date.now()+min*60000;
  state.sleepTimer=setTimeout(()=>{stopAll();state.sleepEnd=null;tickSleep();toast('Uyku zamanlayıcısı yayını durdurdu')},min*60000);
  closeOverlay('#sleepModal'); tickSleep(); renderPlayer();
  toast(`${min} dakika sonra duracak`,'success');
}
function cancelSleep(){
  clearTimeout(state.sleepTimer); state.sleepTimer=null; state.sleepEnd=null;
  tickSleep(); renderPlayer(); closeOverlay('#sleepModal'); toast('Uyku zamanlayıcısı kapatıldı');
}
function tickSleep(){
  let txt='';
  if(state.sleepEnd){const d=Math.max(0,state.sleepEnd-Date.now()),m=Math.floor(d/60000),s=Math.floor(d%60000/1000);txt=`${m}:${String(s).padStart(2,'0')}`}
  $$('[data-bind="sleep"]').forEach(e=>{e.textContent=txt?`☾ ${txt}`:'';e.classList.toggle('show',!!txt)});
  $$('[data-bind="sleepLabel"]').forEach(e=>e.textContent=txt||'Uyku');
  $('#sleepNote').textContent=txt?`Kalan süre: ${txt}`:'Seçtiğin süre dolunca yayın kendiliğinden durur.';
  $('#cancelSleep').style.display=state.sleepEnd?'':'none';
}
setInterval(()=>{if(state.sleepEnd)tickSleep()},1000);

/* ---------- volume ---------- */
function applyVolume(v,save=true){
  v=Math.max(0,Math.min(1,Number(v))); state.volume=v;
  audio.volume=v; video.volume=v; audio.muted=video.muted=v===0;
  $$('.vol-range').forEach(r=>{r.value=v;r.style.setProperty('--v',v*100+'%')});
  $$('[data-act="mute"] use').forEach(u=>u.setAttribute('href',v===0?'#i-mute':'#i-vol'));
  if(save&&v>0) LS.set('orbis_volume',v);
}
let lastVol=state.volume||1;

/* ---------- overlays ---------- */
function openOverlay(sel){$(sel).classList.add('open')}
function closeOverlay(sel){$(sel).classList.remove('open')}
function openFull(){ if(window.matchMedia('(max-width:900px)').matches){$('#fullNp').classList.add('open');$('#fullNp').setAttribute('aria-hidden','false')} }
function closeFull(){$('#fullNp').classList.remove('open');$('#fullNp').setAttribute('aria-hidden','true')}

/* ---------- media session ---------- */
function updateMediaSession(){
  if(!('mediaSession' in navigator)) return;
  const ch=state.current;
  try{
    navigator.mediaSession.metadata= ch ? new MediaMetadata({title:ch.name,artist:[ch.genre,ch.countryName].filter(Boolean).join(' · '),album:'Orbis Canlı',artwork:ch.logo?[{src:ch.logo,sizes:'512x512'}]:[]}) : null;
    navigator.mediaSession.playbackState= state.status==='playing'?'playing':state.status==='paused'?'paused':'none';
  }catch{}
}
if('mediaSession' in navigator){
  const set=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch{}};
  set('play',toggle); set('pause',toggle); set('stop',stopAll);
  set('nexttrack',()=>step(1)); set('previoustrack',()=>step(-1));
}

/* ---------- events ---------- */
function setTab(tab){ if(state.tab===tab&&!state.error) {$('#scroller').scrollTo({top:0,behavior:'smooth'});window.scrollTo({top:0,behavior:'smooth'});return} state.tab=tab; state.query=''; $('#searchInput').value=''; $('#searchBox').classList.remove('has-value'); loadChannels(); }
function setCountry(code){ closeOverlay('#countryModal'); closeFull(); if(state.tab==='favorites') state.tab='radio'; state.country=code; loadChannels(); $('#scroller').scrollTo({top:0}); window.scrollTo({top:0}); }

document.addEventListener('click',e=>{
  const t=e.target;
  const tabBtn=t.closest('[data-tab]'); if(tabBtn){setTab(tabBtn.dataset.tab);return}
  const cBtn=t.closest('[data-country]'); if(cBtn){setCountry(cBtn.dataset.country);return}
  const open=t.closest('[data-open="country"]'); if(open){closeFull();openOverlay('#countryModal');setTimeout(()=>{const a=$('#sheetCountries .active');a&&a.scrollIntoView({block:'center'})},50);return}
  if(t.closest('[data-close]')){closeOverlay('#'+t.closest('.overlay').id);return}
  if(t.classList.contains('overlay')){ if(t.id==='videoModal') closeVideo(); else closeOverlay('#'+t.id); return }
  const g=t.closest('[data-genre]'); if(g){state.genre=g.dataset.genre;state.shown=PAGE;renderGenres();renderGrid();g.scrollIntoView({inline:'nearest',block:'nearest'});return}
  if(t.closest('[data-more]')){state.shown+=PAGE;renderGrid();return}
  if(t.closest('[data-retry]')){loadChannels(true);return}
  const card=t.closest('.card[data-key]');
  if(card){
    const ch=findByKey(card.dataset.key); if(!ch) return;
    if(t.closest('[data-act-card="fav"]')){toggleFav(ch);return}
    if(state.current&&keyOf(state.current)===keyOf(ch)&&state.status!=='error'){ if(ch.type==='tv') openVideo(ch),setVMsg(state.status==='playing'?'':'loading'); else toggle(); }
    else play(ch);
    return;
  }
  const a=t.closest('[data-act]'); if(!a||a.disabled) return;
  switch(a.dataset.act){
    case 'toggle': toggle(); break;
    case 'next': step(1); break;
    case 'prev': step(-1); break;
    case 'stop': stopAll(); closeFull(); break;
    case 'fav': state.current?toggleFav(state.current):toast('Önce bir kanal seç'); break;
    case 'sleep': closeFull(); tickSleep(); $$('#sleepGrid [data-sleep]').forEach(b=>b.classList.remove('on')); openOverlay('#sleepModal'); break;
    case 'pip': togglePiP(); break;
    case 'shuffle': shuffle(); break;
    case 'mute': if(state.volume>0){lastVol=state.volume;applyVolume(0,false)}else applyVolume(lastVol||1); break;
  }
});
$('#npOpen').addEventListener('click',()=>{ if(!state.current) return; if(state.current.type==='tv'&&!window.matchMedia('(max-width:900px)').matches){openVideo(state.current);setVMsg(state.status==='playing'?'':state.status==='error'?'error':'loading')} else openFull() });
$('#fullClose').addEventListener('click',closeFull);
$('#vClose').addEventListener('click',()=>closeVideo());
$('#sleepGrid').addEventListener('click',e=>{const b=e.target.closest('[data-sleep]');if(b)startSleep(Number(b.dataset.sleep))});
$('#cancelSleep').addEventListener('click',cancelSleep);
$('#sideCountrySearch').addEventListener('input',renderCountries);
$('#sheetCountrySearch').addEventListener('input',renderCountries);
$$('.vol-range').forEach(r=>r.addEventListener('input',e=>applyVolume(e.target.value)));
let qTimer;
$('#searchInput').addEventListener('input',e=>{
  $('#searchBox').classList.toggle('has-value',!!e.target.value);
  clearTimeout(qTimer); qTimer=setTimeout(()=>{state.query=e.target.value.trim();state.shown=PAGE;renderGrid()},120);
});
$('#clearSearch').addEventListener('click',e=>{e.preventDefault();const i=$('#searchInput');i.value='';$('#searchBox').classList.remove('has-value');state.query='';renderGrid();i.focus()});
$('#reloadBtn').addEventListener('click',()=>loadChannels(true));
$('#scroller').addEventListener('scroll',e=>$('#header').classList.toggle('scrolled',e.target.scrollTop>4),{passive:true});
window.addEventListener('scroll',()=>$('#header').classList.toggle('scrolled',window.scrollY>4),{passive:true});
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea')){ if(e.key==='Escape') e.target.blur(); return }
  if(e.key==='Escape'){ if($('#videoModal').classList.contains('open')) closeVideo(); $$('.overlay.open').forEach(o=>o.id!=='videoModal'&&o.classList.remove('open')); closeFull(); return }
  if(e.key===' '||e.code==='Space'){ if(e.target.closest('button')) return; e.preventDefault(); if(e.target.matches('.card')) e.target.click(); else toggle() }
  else if(e.key==='Enter'&&e.target.matches('.card')){ e.target.click() }
  else if(e.key==='n'||e.key==='N') step(1);
  else if(e.key==='p'||e.key==='P') step(-1);
  else if(e.key==='/'){ e.preventDefault(); $('#searchInput').focus() }
});
function findByKey(k){
  return state.channels.find(x=>keyOf(x)===k)||getFavs().find(x=>x.id===k)||getRecent().find(x=>x.id===k)||null;
}

/* ---------- init ---------- */
applyVolume(state.volume??1,false);
tickSleep();
renderAll();
loadChannels();
</script>
</body>
